<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">シン・ジウォン</title>
  <desc id="desc">業務を理解し、使われる機能をつくる。Web開発・推薦システム・AI。</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#171c28"/><stop offset="1" stop-color="#0d1119"/></linearGradient>
    <linearGradient id="orbit" x2="1" y2="1"><stop stop-color="#c5c1ff"/><stop offset=".5" stop-color="#91e0ce"/><stop offset="1" stop-color="#91e0ce" stop-opacity=".1"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#e1e7ff" stroke-opacity=".04"/></pattern>
    <clipPath id="clip"><rect width="1200" height="420" rx="24"/></clipPath>
    <style>text{font-family:'Yu Gothic','Meiryo','Noto Sans JP',sans-serif}</style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="420" fill="url(#background)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <circle cx="1000" cy="208" r="176" fill="#c5c1ff" fill-opacity=".025"/>
    <g transform="translate(1000 208)">
      <circle r="124" fill="none" stroke="#c5c1ff" stroke-opacity=".13"/>
      <ellipse rx="170" ry="67" transform="rotate(-38)" fill="none" stroke="url(#orbit)" stroke-width="2"/>
      <ellipse rx="170" ry="67" transform="rotate(38)" fill="none" stroke="url(#orbit)" stroke-width="2"/>
      <ellipse rx="170" ry="67" transform="rotate(90)" fill="none" stroke="url(#orbit)" stroke-width="2"/>
      <circle r="38" fill="#91e0ce" fill-opacity=".07" stroke="#91e0ce" stroke-opacity=".4"/>
      <circle r="7" fill="#91e0ce"/>
      <circle cx="136" cy="-87" r="6" fill="#c5c1ff"/>
      <circle cx="-102" cy="-117" r="4" fill="#91e0ce"/>
      <circle cx="0" cy="170" r="5" fill="#c5c1ff"/>
    </g>
    <rect x="64" y="60" width="28" height="3" rx="1.5" fill="#91e0ce"/>
    <text x="106" y="67" font-size="15" letter-spacing="3" fill="#a5b0c4">開発者の記録</text>
    <text x="60" y="165" font-size="62" font-weight="700" letter-spacing="2" fill="#f3f3fa">シン・ジウォン</text>
    <text x="64" y="222" font-size="25" font-weight="500" fill="#d4d7e4">業務を理解し、</text>
    <text x="64" y="265" font-size="25" font-weight="500" fill="#d4d7e4">使われる機能をつくる。</text>
    <path d="M64 308H750" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="64" y="345" font-size="17" fill="#91e0ce">Web開発</text>
    <text x="175" y="345" font-size="17" fill="#69758b">／</text>
    <text x="211" y="345" font-size="17" fill="#c5c1ff">推薦システム</text>
    <text x="365" y="345" font-size="17" fill="#69758b">／</text>
    <text x="401" y="345" font-size="17" fill="#d4d7e4">AI</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="419" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity=".09"/>
</svg>
